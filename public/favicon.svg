<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#lockGradient)" stroke="url(#goldGradient)" stroke-width="3"/>
  
  <!-- Lock shackle (U-shaped top) -->
  <path d="M 35 45 Q 35 25, 50 25 Q 65 25, 65 45" 
        stroke="url(#goldGradient)" 
        stroke-width="7" 
        fill="none" 
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Lock body -->
  <rect x="35" y="45" width="30" height="35" rx="4" fill="url(#goldGradient)"/>
  
  <!-- Keyhole -->
  <circle cx="50" cy="58" r="5" fill="#1E3A8A"/>
  <rect x="47" y="58" width="6" height="10" rx="1" fill="#1E3A8A"/>
</svg>

